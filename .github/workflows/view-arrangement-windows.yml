name: SmartMerge Windows View and Usability Validation

on:
  push:
    branches:
      - feature/view-arrange-20261119
      - feature/smartmerge-view-session-20261119
      - master
    paths:
      - 'ExcelMerge.GUI/**'
      - 'ExcelMerge/**'
      - 'ExcelMerge.RegressionTests/**'
      - 'FastWpfGrid/**'
      - '.github/workflows/view-arrangement-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore Windows NuGet packages
        run: nuget restore ExcelMerge.sln
      - name: Compile Windows GUI Release
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Compile regression tests
        run: msbuild ExcelMerge.RegressionTests\ExcelMerge.RegressionTests.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Run regression tests, including row/column layout
        shell: pwsh
        run: |
          & '.\ExcelMerge.RegressionTests\bin\Release\ExcelMerge.RegressionTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed: $LASTEXITCODE" }
      - name: Package portable Windows EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'ExcelMerge.GUI/bin/Release/ExcelMerge.GUI.exe')) { throw 'Missing executable' }
          Compress-Archive -Path 'ExcelMerge.GUI/bin/Release/*' -DestinationPath 'SmartMerge-20261119-view-session-Windows-EXE.zip' -Force
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartMerge-ViewSession-Windows-EXE
          path: SmartMerge-20261119-view-session-Windows-EXE.zip
      - name: Publish tested release from master only
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.8-view-session --repo cxhttt233/SmartExcelMerge --target "${{ github.sha }}" --title "SmartMerge 1.3.8 · 精确恢复与视图保留" --notes "左右对照视图可按序号或内容搜索并选择恢复指定隐藏行列。切换工作表或重新比较后，只在记录映射一致时恢复本次会话中的隐藏与置顶状态，避免数据错位。保留 1.3.7 的隐藏、置顶、左右同步和差异筛选功能。所有操作不修改 Excel 原文件。Windows 编译、主键与视图回归测试通过。" '.\SmartMerge-20261119-view-session-Windows-EXE.zip'
