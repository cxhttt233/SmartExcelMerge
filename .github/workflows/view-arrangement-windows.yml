name: SmartMerge Windows View and Usability Validation

on:
  push:
    branches:
      - feature/view-arrange-20261119
      - feature/smartmerge-view-session-20261119
      - fix/cancel-large-diff-20261119
      - master
    paths:
      - 'ExcelMerge.GUI/**'
      - 'ExcelMerge/**'
      - 'ExcelMerge.RegressionTests/**'
      - 'FastWpfGrid/**'
      - '.github/workflows/view-arrangement-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore Windows NuGet packages
        run: nuget restore ExcelMerge.sln
      - name: Compile Windows GUI Release
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Compile regression tests
        run: msbuild ExcelMerge.RegressionTests\ExcelMerge.RegressionTests.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Run regression tests, including row/column layout
        shell: pwsh
        run: |
          & '.\ExcelMerge.RegressionTests\bin\Release\ExcelMerge.RegressionTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed: $LASTEXITCODE" }
      - name: Package portable Windows EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'ExcelMerge.GUI/bin/Release/ExcelMerge.GUI.exe')) { throw 'Missing executable' }
          New-Item -ItemType Directory -Force -Path 'ExcelMerge.GUI/bin/Release/samples' | Out-Null
          Copy-Item 'docs/demo/smart-diff-before.xlsx' 'ExcelMerge.GUI/bin/Release/samples/'
          Copy-Item 'docs/demo/smart-diff-after.xlsx' 'ExcelMerge.GUI/bin/Release/samples/'
          Copy-Item 'docs/demo/视图整理试用说明.txt' 'ExcelMerge.GUI/bin/Release/试用说明.txt'
          Compress-Archive -Path 'ExcelMerge.GUI/bin/Release/*' -DestinationPath 'SmartMerge-20261119-cancel-large-diff-Windows-EXE.zip' -Force
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartMerge-CancelAndLargeDiff-Windows-EXE
          path: SmartMerge-20261119-cancel-large-diff-Windows-EXE.zip
      - name: Publish tested release from master only
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.9-cancel-large-diff --repo cxhttt233/SmartExcelMerge --target "${{ github.sha }}" --title "SmartMerge 1.3.9 · 修复取消报错与大表计算卡顿" --notes "修复取消计算后继续创建空差异视图导致的空引用；后台异常直接报告；大表无可靠主键时不再进入高耗时逐行对比；新增行按二分查找对齐；显示明确取消操作并保留已有表格。包含回归测试、示例文件和中文说明。" '.\SmartMerge-20261119-cancel-large-diff-Windows-EXE.zip'
