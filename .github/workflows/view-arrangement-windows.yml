name: SmartMerge View Arrangement Windows Validation

on:
  push:
    branches:
      - feature/view-arrange-20261119
      - master
    paths:
      - 'ExcelMerge.GUI/**'
      - 'ExcelMerge/**'
      - 'ExcelMerge.RegressionTests/**'
      - 'FastWpfGrid/**'
      - '.github/workflows/view-arrangement-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore Windows NuGet packages
        run: nuget restore ExcelMerge.sln
      - name: Compile Windows GUI Release
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Compile regression tests
        run: msbuild ExcelMerge.RegressionTests\ExcelMerge.RegressionTests.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Run regression tests, including row/column layout
        shell: pwsh
        run: |
          & '.\ExcelMerge.RegressionTests\bin\Release\ExcelMerge.RegressionTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed: $LASTEXITCODE" }
      - name: Package portable Windows EXE
        shell: pwsh
        run: |
          if (-not (Test-Path 'ExcelMerge.GUI/bin/Release/ExcelMerge.GUI.exe')) { throw 'Missing executable' }
          Compress-Archive -Path 'ExcelMerge.GUI/bin/Release/*' -DestinationPath 'SmartMerge-20261119-view-arrangement-Windows-EXE.zip' -Force
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartMerge-ViewArrangement-Windows-EXE
          path: SmartMerge-20261119-view-arrangement-Windows-EXE.zip
      - name: Publish tested release from master only
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.7-view-arrangement --repo cxhttt233/SmartExcelMerge --target "${{ github.sha }}" --title "SmartMerge 1.3.7 · 视图隐藏与置顶" --notes "左右对照表格新增：隐藏选中行、隐藏选中列、恢复手动隐藏行列、选中行置顶并固定、选中列置左并固定、恢复默认顺序。操作仅调整显示，不写回 Excel。与差异类别筛选共同工作，新增布局回归测试。" '.\SmartMerge-20261119-view-arrangement-Windows-EXE.zip'
