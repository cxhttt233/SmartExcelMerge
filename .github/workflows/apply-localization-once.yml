name: Apply localization once

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022

    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v4
        with:
          ref: feature/chinese-localization
          fetch-depth: 0

      - name: Apply Simplified Chinese localization
        shell: pwsh
        run: python .\scripts\apply_zh_cn_localization.py

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        shell: pwsh
        run: nuget restore ExcelMerge.sln -NonInteractive

      - name: Build Release
        shell: pwsh
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Commit localized source
        shell: pwsh
        run: |
          Remove-Item .\scripts\apply_zh_cn_localization.py -Force
          Remove-Item .\.github\workflows\apply-zh-cn-localization.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Simplified Chinese localization"
          git push origin HEAD:feature/chinese-localization

      - name: Restore master branch
        shell: pwsh
        run: git push --force origin c62034f5807a2fabbcd2398c15c11dcf536b9141:master
