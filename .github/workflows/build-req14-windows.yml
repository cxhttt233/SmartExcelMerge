name: SmartMerge Windows build
on:
  push:
    branches: [master]
    paths: ['.github/workflows/build-req14-windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - run: nuget restore ExcelMerge.sln
      - run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMerge-Windows-EXE
          path: ExcelMerge.GUI/bin/Release/
