name: Build SmartMerge Req 1+4 + Key Analysis Windows EXE
on:
  push:
    branches: [master]
    paths: ['.github/workflows/build-req14-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Verify source features
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path 'ExcelMerge.GUI/Views/DiffView.xaml.cs' -Pattern 'FormatExcelClipboardCell' -Quiet)) { throw 'Excel clipboard patch missing' }
          if (-not (Select-String -Path 'ExcelMerge.GUI/Views/DiffView.xaml' -Pattern 'DiffCategoryFilterPanel' -Quiet)) { throw 'Diff category panel missing' }
          if (-not (Select-String -Path 'ExcelMerge.GUI/Views/DiffView.KeyAnalysis.cs' -Pattern 'RowKeyAnalysisButton_Click' -Quiet)) { throw 'Row key analysis UI missing' }
          if (-not (Select-String -Path 'ExcelMerge/RowKeySelectionEngine.cs' -Pattern 'CloneWithCompositeKey' -Quiet)) { throw 'Composite key engine missing' }
      - name: Restore NuGet packages
        run: nuget restore ExcelMerge.sln
      - name: Compile Windows GUI Release
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Build row-key regression tests
        run: msbuild ExcelMerge.RegressionTests\ExcelMerge.RegressionTests.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Run row-key regression tests
        shell: pwsh
        run: |
          & '.\ExcelMerge.RegressionTests\bin\Release\ExcelMerge.RegressionTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed: $LASTEXITCODE" }
      - name: ZIP portable Windows application
        shell: pwsh
        run: |
          if (-not (Test-Path 'ExcelMerge.GUI/bin/Release/ExcelMerge.GUI.exe')) { throw 'EXE was not compiled' }
          Compress-Archive -Path 'ExcelMerge.GUI/bin/Release/*' -DestinationPath 'SmartMerge-20261119-req1-4-key-analysis-Windows-EXE.zip' -Force
          (Get-FileHash 'SmartMerge-20261119-req1-4-key-analysis-Windows-EXE.zip' -Algorithm SHA256).Hash | Set-Content 'SHA256.txt'
      - name: Upload ready-to-run executable archive
        uses: actions/upload-artifact@v4
        with:
          name: SmartMerge-20261119-req1-4-key-analysis-Windows-EXE
          path: SmartMerge-20261119-req1-4-key-analysis-Windows-EXE.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.6-req1-4-key-analysis --repo cxhttt233/SmartExcelMerge --target master --title "SmartMerge 1.3.6 - Excel复制、差异筛选与主键分析恢复" --notes "需求1：Excel兼容的多行/引号TSV/CSV复制。需求4：新增/修改/删除分类筛选，仅在仅显示差异模式出现。恢复主键分析：自动候选评估、手动单主键和联合主键、唯一率/覆盖率/重合率分析及预览。包含Windows .NET Framework 4.8 EXE和回归测试。" '.\SmartMerge-20261119-req1-4-key-analysis-Windows-EXE.zip'
