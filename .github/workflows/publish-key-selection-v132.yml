name: Publish key selection v1.3.2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-key-selection-v132.yml

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-2022

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/key-selection-analysis
          fetch-depth: 0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore ExcelMerge.sln

      - name: Build GUI Release
        run: msbuild ExcelMerge.GUI\ExcelMerge.GUI.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build regression tests
        run: msbuild ExcelMerge.RegressionTests\ExcelMerge.RegressionTests.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Run regression tests
        shell: pwsh
        run: |
          & .\ExcelMerge.RegressionTests\bin\Release\ExcelMerge.RegressionTests.exe 2>&1 | Tee-Object regression-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path ExcelMerge.GUI\bin\Release\* -DestinationPath SmartExcelMerge-key-selection-cn-v1.3.2.zip -Force
          $hash = (Get-FileHash SmartExcelMerge-key-selection-cn-v1.3.2.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SmartExcelMerge-key-selection-cn-v1.3.2.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2-cn-key-selection
          target_commitish: agent/key-selection-analysis
          name: SmartExcelMerge 中文主键选择版 v1.3.2
          body: |
            本版本改进主键信息展示与手动主键分析：

            - 当前主键在主界面顶部常驻显示，不再需要打开弹窗确认。
            - 同时显示自动/手动模式、左右唯一率、两表重合率和匹配数量。
            - 手动单主键和联合主键应用后重新计算并保留完整分析结果。
            - 主键分析窗口显示当前所用主键的完整质量指标。
            - 保留 v1.3.1 的主键分析窗口类型转换修复。
            - Windows Release 构建与六项回归测试全部通过后发布。
          files: |
            SmartExcelMerge-key-selection-cn-v1.3.2.zip
            SHA256SUMS.txt
            regression-test-output.txt
          fail_on_unmatched_files: true

      - name: Record successful release
        shell: pwsh
        run: |
          "v1.3.2-cn-key-selection released successfully at $(Get-Date -Format o)" | Set-Content RELEASE-KEY-SELECTION-v1.3.2.txt -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-KEY-SELECTION-v1.3.2.txt
          git commit -m "chore: record v1.3.2 release"
          git push origin HEAD:agent/key-selection-analysis
